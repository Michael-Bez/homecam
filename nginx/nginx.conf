worker_processes auto;

events {
    worker_connections 512;
}

http {
    #  throttle to 5 req/s per client IP —  protects basic-auth from brute force.
    # burst=10 allows a short burst before dropping requests with 503.
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # TLS 1.2+ only; omit old ciphers.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # basic auth on every route, defence in depth behind Tailscale.
        # A stolen Tailscale auth key does not expose the camera without this
        
        auth_basic           "homecam";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Default proxy for dashboard, API, snapshot endpoints.
        location / {
            limit_req zone=general burst=10 nodelay;
            proxy_pass         http://app:8000;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_read_timeout 30s;
        }

        # MJPEG stream: disable buffering so frames are forwarded immediately,
        # and extend the read timeout to keep the stream alive.
        location /stream {
            limit_req zone=general burst=5 nodelay;
            proxy_pass            http://app:8000;
            proxy_set_header      Host        $host;
            proxy_buffering       off;
            proxy_read_timeout    3600s;    # keep alive for up to 1 hour
            proxy_send_timeout    3600s;
        }

        access_log /dev/stdout;
        error_log  /dev/stderr warn;
    }
}
